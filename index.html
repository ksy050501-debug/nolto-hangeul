<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칠판 받아쓰기</title><meta name="description" content="글자 수 힌트와 세 번의 확인 기회가 있는 수업용 가사 받아쓰기"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231c423b'/%3E%3Ctext x='5' y='24' font-size='24' fill='white'%3E♪%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:16px;color:#f7f7e9;background:#172e29}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.board{width:min(850px,100%);padding:clamp(24px,5vw,48px);background:radial-gradient(ellipse at 20% 0%,#ffffff07,transparent 65%),#23483e;border:12px solid #8c6645;border-radius:7px;box-shadow:0 20px 65px #0005,inset 0 0 25px #0003}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #ffffff30;padding-bottom:20px}h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:0}#chance{font-size:.95rem;color:#ffe8a0}.hint{color:#cedbd1;font-size:.95rem;line-height:1.7}#blanks{display:flex;flex-wrap:wrap;column-gap:22px;row-gap:20px;padding:25px 0 30px}.word{display:inline-flex;gap:6px;flex-wrap:wrap;max-width:100%}.slot{display:flex;flex-direction:column;align-items:center;min-width:28px}.letter{height:38px;width:30px;text-align:center;font-size:1.5rem;border-bottom:2px solid #f4f1d4}.slot.correct .letter{color:#ffe68d;border-color:#ffe68d}.number{font-size:.75rem;color:#b9cdc0;margin-top:5px}.slot.correct .number{color:#ffe68d}label{display:block;margin-bottom:10px;font-weight:700}textarea,input{font:inherit;border:1px solid #ffffff55;border-radius:8px;background:#142f28;color:white;padding:15px;width:100%;line-height:1.6}textarea{min-height:95px;resize:vertical;font-size:1.15rem}textarea:focus,input:focus{outline:3px solid #ffe68d;outline-offset:3px}button{font:inherit;font-weight:750;border:0;border-radius:7px;padding:13px 20px;cursor:pointer;background:#ffe68d;color:#263e33}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid white;outline-offset:3px}.secondary{background:transparent;color:#f5f4df;border:1px solid #ffffff65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#feedback{min-height:28px;line-height:1.7;color:#ffe68d;margin:18px 0 0}#history{font-size:.9rem;line-height:1.7;color:#cedbd1;padding-left:20px}#result{text-align:center;border-top:1px solid #ffffff40;margin-top:20px;padding-top:25px}#score{display:block;font-size:clamp(3rem,10vw,4.5rem);font-weight:900;color:#ffe68d}#result h2{font-size:1.1rem;margin:0}#result p{line-height:1.7}.hidden{display:none!important}#setup{margin-top:24px}#setup p{color:#cedbd1;line-height:1.7}#setup label{margin-top:15px}#setupError{color:#ffe68d}#inputCount{font-size:.875rem;margin-top:8px;color:#cedbd1}footer{font-size:.875rem;line-height:1.6;color:#b9cdc0;border-top:1px solid #ffffff25;margin-top:20px;padding-top:15px}@media(max-width:500px){body{padding:10px}.board{border-width:8px;padding:22px 18px}header{align-items:flex-start;flex-direction:column}.word{gap:4px}.letter{width:26px}.slot{min-width:26px}.actions button{flex:1}} 
</style></head>
<body><main class="board"><header><h1 id="title">♪ 칠판 받아쓰기</h1><span id="chance">확인 기회 3 / 3</span></header>
<section id="setup"><label for="teacherAnswer">교사 · 정답 가사</label><textarea id="teacherAnswer" maxlength="500" placeholder="정답 가사를 띄어쓰기와 함께 입력하세요."></textarea><p>정답을 넣고 시작하면 학생에게는 글자 수와 답안 입력칸만 보입니다.</p><button id="start">학생 화면 시작</button><p id="setupError" role="alert"></p></section>
<section id="game" class="hidden"><p class="hint" id="hint"></p><div id="blanks" aria-label="단어별 정답 글자 수"></div><label for="guess">들은 가사를 입력하세요</label><textarea id="guess" maxlength="1000" placeholder="가사를 적고 맞힌 글자를 확인해보세요." spellcheck="false"></textarea><div id="inputCount"></div><div class="actions"><button id="check">맞힌 글자 확인 (1/3)</button><button id="submit" class="secondary" disabled>최종 제출</button></div><p id="feedback" role="status" aria-live="polite"></p><ol id="history" aria-label="확인 기록"></ol><section id="result" class="hidden" aria-live="polite"><h2>최종 점수</h2><strong id="score"></strong><p id="summary"></p></section><footer>띄어쓰기와 문장부호는 제외합니다. 같은 위치의 글자가 같으면 정답으로 인정합니다.<br>3회 확인 후 마지막으로 수정할 수 있어요. 최종 제출하면 답안이 확정됩니다.</footer></section>
</main><script>
'use strict';
// 정답을 받으면 이 값에 반영하여 학생 화면으로 바로 시작합니다.
const CONFIG={answer:'동네에선 어린 아가들이 도담도담 잘 지내고\n이웃 형은 파니 논단다\n어여쁜 소년을 깜짝 마주했다면\n살랑이는 윤슬에 비춰 몰래 얼굴을 빤히 본단다',title:'♪ 칠판 받아쓰기'};
const $=id=>document.getElementById(id);let expected=[],words=[],attempts=0,finished=false,started=false;
function normalize(value){return Array.from(value.normalize('NFC').replace(/[\s\p{P}]/gu,''));}
function evaluate(answer){const actual=normalize(answer);const correct=expected.map((c,i)=>c===actual[i]);const matched=correct.filter(Boolean).length;return {actual,correct,matched,total:expected.length,score:Math.round(matched/expected.length*100)};}
function draw(correct=[],actual=[]){$('blanks').replaceChildren();let index=0;words.forEach(word=>{const group=document.createElement('div');group.className='word';word.forEach(()=>{const i=index++;const slot=document.createElement('span');slot.className='slot'+(correct[i]?' correct':'');const letter=document.createElement('span');letter.className='letter';letter.textContent=correct[i]?actual[i]:'\u00a0';const number=document.createElement('span');number.className='number';number.textContent=i+1;slot.setAttribute('aria-label',`${i+1}번째 글자: ${correct[i]?actual[i]+' 정답':'빈칸'}`);slot.append(letter,number);group.append(slot);});$('blanks').append(group);});}
function start(raw){words=raw.normalize('NFC').trim().split(/\s+/u).map(normalize).filter(w=>w.length);expected=words.flat();if(!expected.length||expected.length>500){$('setupError').textContent='정답을 1~500글자로 입력해주세요.';return false;}started=true;attempts=0;finished=false;$('title').textContent=CONFIG.title;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('teacherAnswer').value='';$('hint').textContent=`총 ${expected.length}글자 · ${words.length}개 단어. 밑줄 하나는 한 글자입니다.`;draw();updateInput();$('guess').focus();return true;}
function updateInput(){const length=normalize($('guess').value).length;$('inputCount').textContent=`입력 ${length} / 정답 ${expected.length}글자`;$('submit').disabled=!started||finished||attempts<3||length===0;}
function check(){if(!started||finished||attempts>=3)return null;const r=evaluate($('guess').value);if(!r.actual.length){$('feedback').textContent='답안을 먼저 입력해주세요. 확인 기회는 사용되지 않았어요.';return null;}attempts++;draw(r.correct,r.actual);const positions=r.correct.flatMap((c,i)=>c?[i+1]:[]);$('feedback').textContent=`${r.matched} / ${r.total}글자 정답 · ${attempts===3?'확인 기회를 모두 사용했어요. 마지막 수정 후 최종 제출하세요.':`확인 기회 ${3-attempts}회 남음`}`;const entry=document.createElement('li');entry.textContent=`${attempts}회: ${r.matched}글자 일치 · 맞힌 위치 ${positions.length?positions.join(', ')+'번':'없음'}`;$('history').append(entry);$('chance').textContent=`확인 기회 ${3-attempts} / 3`;$('check').disabled=attempts===3;$('check').textContent=attempts===3?'확인 완료 (3/3)':`맞힌 글자 확인 (${attempts+1}/3)`;updateInput();return {matched:r.matched,total:r.total,positions,attempts};}
function submit(){if(!started||finished||attempts<3||!normalize($('guess').value).length)return null;const r=evaluate($('guess').value);finished=true;$('guess').disabled=true;$('check').disabled=true;$('submit').disabled=true;$('result').classList.remove('hidden');$('score').textContent=r.score+'점';const extra=Math.max(0,r.actual.length-r.total);$('summary').textContent=`${r.matched} / ${r.total}글자 일치 · 정답률 ${r.score}%`+(extra?` · 정답보다 ${extra}글자 더 입력했어요.`:'');$('feedback').textContent='최종 답안이 제출되었습니다.';$('chance').textContent='제출 완료';draw(r.correct,r.actual);return {matched:r.matched,total:r.total,score:r.score};}
$('start').onclick=()=>start($('teacherAnswer').value);$('check').onclick=check;$('submit').onclick=submit;$('guess').addEventListener('input',()=>{updateInput();if(attempts>0&&!finished)$('feedback').textContent=attempts<3?'답안을 수정했어요. 칠판의 노란 글자는 직전 확인 결과입니다.':'답안을 수정했어요. 최종 제출하면 현재 답안으로 채점합니다.';});
if(CONFIG.answer)start(CONFIG.answer);
</script></body></html>
